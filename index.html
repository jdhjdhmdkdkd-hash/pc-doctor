<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PC Doctor | Internet Speed Test</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#080b12;
    color:white;
}

header{
    padding:20px 8%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #202938;
}

.logo{
    font-size:25px;
    font-weight:bold;
}

.logo span{
    color:#00d4ff;
}

nav{
    display:flex;
    gap:25px;
}

nav a{
    color:#aaa;
    text-decoration:none;
}

nav a:hover{
    color:#00d4ff;
}


/* HERO */

.hero{
    min-height:50vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:60px 20px;
}

.hero h1{
    font-size:55px;
    margin-bottom:20px;
}

.hero h1 span{
    color:#00d4ff;
}

.hero p{
    color:#9aa4b2;
    font-size:18px;
    line-height:1.6;
}


/* SPEED TEST */

.speed-section{
    padding:70px 8%;
    background:#0c1018;
}

.speed-section h2{
    text-align:center;
    font-size:35px;
    margin-bottom:40px;
}

.speed-box{
    max-width:900px;
    margin:auto;
    background:#111722;
    border:1px solid #202938;
    border-radius:20px;
    padding:40px;
    text-align:center;
}


/* METER */

.meter{
    width:280px;
    height:280px;
    border-radius:50%;
    margin:10px auto 30px;

    background:
    conic-gradient(
        #00d4ff 0deg,
        #00d4ff 0deg,
        #202938 0deg
    );

    display:flex;
    justify-content:center;
    align-items:center;

    transition:
    background 0.5s ease;
}

.meter-inner{
    width:220px;
    height:220px;
    background:#080b12;
    border-radius:50%;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.speed-number{
    font-size:48px;
    font-weight:bold;
    color:#00d4ff;
}

.speed-unit{
    color:#8d98a8;
    margin-top:5px;
}

.test-status{
    color:#9aa4b2;
    margin-bottom:25px;
}


/* BUTTON */

.btn{
    border:none;
    background:#00d4ff;
    color:#001018;
    padding:15px 35px;
    border-radius:8px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

.btn:hover{
    transform:translateY(-3px);
    box-shadow:0 0 30px #00d4ff55;
}

.btn:disabled{
    opacity:.5;
    cursor:not-allowed;
}


/* RESULTS */

.results{
    margin-top:40px;

    display:grid;
    grid-template-columns:
    repeat(3,1fr);

    gap:20px;
}

.result-card{
    background:#080b12;
    border:1px solid #202938;
    border-radius:12px;
    padding:25px;
}

.result-card .icon{
    font-size:30px;
    margin-bottom:12px;
}

.result-card h3{
    color:#9aa4b2;
    font-size:15px;
    margin-bottom:10px;
}

.result-card p{
    font-size:28px;
    font-weight:bold;
    color:#00d4ff;
}


/* FOOTER */

footer{
    text-align:center;
    padding:30px;
    color:#6f7886;
}


/* MOBILE */

@media(max-width:700px){

    nav{
        display:none;
    }

    .hero h1{
        font-size:40px;
    }

    .speed-box{
        padding:25px 15px;
    }

    .meter{
        width:230px;
        height:230px;
    }

    .meter-inner{
        width:180px;
        height:180px;
    }

    .speed-number{
        font-size:40px;
    }

    .results{
        grid-template-columns:1fr;
    }

}

</style>

</head>


<body>


<!-- HEADER -->

<header>

<div class="logo">
PC<span>Doctor</span>
</div>

<nav>

<a href="#">
Home
</a>

<a href="#speed">
Speed Test
</a>

</nav>

</header>


<!-- HERO -->

<section class="hero">

<div>

<h1>
Internet <span>Speed Test</span>
</h1>

<p>
Check your download speed, upload speed and
network latency directly from your browser.
</p>

</div>

</section>


<!-- SPEED TEST -->

<section class="speed-section" id="speed">

<h2>
🌐 Connection Test
</h2>


<div class="speed-box">


<div class="meter" id="meter">

<div class="meter-inner">

<div class="speed-number"
id="speedNumber">
0
</div>

<div class="speed-unit">
Mbps
</div>

</div>

</div>


<div class="test-status"
id="status">

Ready to test your connection

</div>


<button
class="btn"
id="startButton"
onclick="startTest()">

🚀 Start Speed Test

</button>


<div class="results">


<div class="result-card">

<div class="icon">
⬇️
</div>

<h3>
DOWNLOAD
</h3>

<p id="download">
--
</p>

</div>


<div class="result-card">

<div class="icon">
⬆️
</div>

<h3>
UPLOAD
</h3>

<p id="upload">
--
</p>

</div>


<div class="result-card">

<div class="icon">
📡
</div>

<h3>
PING
</h3>

<p id="ping">
--
</p>

</div>


</div>

</div>

</section>


<footer>

© 2026 PC Doctor. All rights reserved.

</footer>


<!-- CLOUDFLARE SPEEDTEST -->

<script src="https://cdn.jsdelivr.net/npm/@cloudflare/speedtest@1.10.0/dist/speedtest.umd.js"></script>


<script>


function updateMeter(speed){

    const meter =
        document.getElementById("meter");

    const number =
        document.getElementById("speedNumber");


    number.innerText =
        speed.toFixed(1);


    /*
        Meter max display = 500 Mbps

        500 Mbps = full circle
    */

    let percentage =
        Math.min(speed / 500, 1);

    let degrees =
        percentage * 360;


    meter.style.background =
        `conic-gradient(
            #00d4ff ${degrees}deg,
            #202938 ${degrees}deg
        )`;

}


function startTest(){

    const button =
        document.getElementById(
            "startButton"
        );

    const status =
        document.getElementById(
            "status"
        );


    const download =
        document.getElementById(
            "download"
        );

    const upload =
        document.getElementById(
            "upload"
        );

    const ping =
        document.getElementById(
            "ping"
        );


    button.disabled=true;

    button.innerText=
        "⏳ Testing...";


    download.innerText="Testing...";
    upload.innerText="Testing...";
    ping.innerText="Testing...";


    updateMeter(0);


    status.innerText=
        "📡 Measuring your connection...";


    try{

        const speedtest =
            new SpeedTest({

                autoStart:true,

                measureDownloadLoadedLatency:true,

                measureUploadLoadedLatency:true

            });


        speedtest.onResultsChange = results => {

            try{

                const down =
                    results.getDownloadBandwidth();

                const up =
                    results.getUploadBandwidth();


                if(down){

                    const downMbps =
                        down / 1000000;

                    updateMeter(
                        downMbps
                    );

                    download.innerText =
                        downMbps.toFixed(2)
                        + " Mbps";

                }


                if(up){

                    const upMbps =
                        up / 1000000;

                    upload.innerText =
                        upMbps.toFixed(2)
                        + " Mbps";

                }


                const latency =
                    results.getUnloadedLatency();


                if(latency){

                    ping.innerText =
                        Math.round(latency)
                        + " ms";

                }


                status.innerText=
                    "⚡ Testing...";

            }

            catch(error){

                console.log(error);

            }

        };


        speedtest.onFinish = results => {

            try{

                const down =
                    results.getDownloadBandwidth();

                const up =
                    results.getUploadBandwidth();

                const latency =
                    results.getUnloadedLatency();


                if(down){

                    const downMbps =
                        down / 1000000;

                    download.innerText =
                        downMbps.toFixed(2)
                        + " Mbps";

                    updateMeter(
                        downMbps
                    );

                }


                if(up){

                    const upMbps =
                        up / 1000000;

                    upload.innerText =
                        upMbps.toFixed(2)
                        + " Mbps";

                }


                if(latency){

                    ping.innerText =
                        Math.round(latency)
                        + " ms";

                }


                status.innerText=
                    "✅ Speed Test Complete";


                button.disabled=false;

                button.innerText=
                    "🔄 Test Again";

            }

            catch(error){

                console.error(error);

                status.innerText=
                    "⚠️ Could not read final results";

                button.disabled=false;

                button.innerText=
                    "🔄 Try Again";

            }

        };


    }

    catch(error){

        console.error(error);


        status.innerText=
            "❌ Speed test failed";


        button.disabled=false;

        button.innerText=
            "🔄 Try Again";

    }

}

</script>


</body>
</html>
